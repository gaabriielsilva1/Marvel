            { id: 74, phase: 'Fase 6', title: 'Vingadores: Doomsday', year: 2026, type: 'Filme' },
            { id: 75, phase: 'Fase 6', title: 'Homem-Aranha 4', year: 2026, type: 'Filme' },
            { id: 76, phase: 'Fase 6', title: 'Vingadores: Guerras Secretas', year: 2027, type: 'Filme' },
        ];

        function App() {
            // Estado para armazenar os itens assistidos. Puxa do localStorage se existir.
            const [watched, setWatched] = React.useState(() => {
                const saved = localStorage.getItem('mcuWatched');
                return saved ? JSON.parse(saved) : {};
            });

            // Atualiza o localStorage sempre que houver mudança no estado
            React.useEffect(() => {
                localStorage.setItem('mcuWatched', JSON.stringify(watched));
            }, [watched]);

            const toggleWatch = (id) => {
                setWatched(prev => ({
                    ...prev,
                    [id]: !prev[id]
                }));
            };

            // Agrupando a lista por Fases para facilitar a visualização
            const phases = mcuList.reduce((acc, item) => {
                if (!acc[item.phase]) acc[item.phase] = [];
                acc[item.phase].push(item);
                return acc;
            }, {});

            // Conta progresso
            const total = mcuList.length;
            const watchedCount = Object.values(watched).filter(Boolean).length;
            const progress = Math.round((watchedCount / total) * 100);

            return (
                <div className="max-w-5xl mx-auto p-6 md:p-10">
                    <header className="mb-10 text-center border-b border-gray-800 pb-8">
                        <h1 className="text-4xl md:text-5xl font-black uppercase tracking-widest text-red-600 mb-4">
                            Maratona MCU
                        </h1>
                        <p className="text-gray-400 text-lg mb-6">Acompanhe sua jornada pela Saga do Infinito e Multiverso</p>

                        <div className="max-w-md mx-auto bg-gray-800 rounded-full h-4 overflow-hidden shadow-inner relative">
                            <div
                                className="bg-red-600 h-full transition-all duration-500 ease-out"
                                style={{ width: `${progress}%` }}
                            ></div>
                        </div>
                        <p className="text-sm text-gray-500 mt-2 font-medium">
                            {watchedCount} de {total} assistidos ({progress}%)
                        </p>
                    </header>

                    <div className="space-y-12">
                        {Object.entries(phases).map(([phase, items]) => (
                            <section key={phase} className="bg-gray-800/30 p-6 md:p-8 rounded-2xl border border-gray-800">
                                <h2 className="text-2xl font-bold text-white mb-6 flex items-center gap-3">
                                    <span className="w-8 h-1 bg-red-600 rounded-full inline-block"></span>
                                    {phase}
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {items.map(item => {
                                        const isWatched = !!watched[item.id];
                                        return (
                                            <div
                                                key={item.id}
                                                onClick={() => toggleWatch(item.id)}
                                                className={`cursor-pointer group flex items-start gap-4 p-4 rounded-xl transition-all duration-200 border-2 
                                                    ${isWatched
                                                        ? 'bg-green-900/20 border-green-700/50 hover:bg-green-900/40'
                                                        : 'bg-gray-800 border-transparent hover:border-gray-600 hover:bg-gray-750'
                                                    }`}
                                            >
                                                <div className={`mt-1 flex-shrink-0 w-6 h-6 rounded-md flex items-center justify-center border-2 transition-colors
                                                    ${isWatched
                                                        ? 'bg-green-500 border-green-500 text-gray-900'
                                                        : 'border-gray-500 group-hover:border-gray-400 text-transparent'
                                                    }`}
                                                >
                                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
                                                        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                                                    </svg>
                                                </div>
                                                <div>
                                                    <h3 className={`font-semibold text-lg leading-tight mb-1 transition-colors ${isWatched ? 'text-green-100 line-through decoration-green-500/50' : 'text-gray-100'}`}>
                                                        {item.title}
                                                    </h3>
                                                    <div className="flex gap-2 text-sm text-gray-400">
                                                        <span className="bg-gray-900/50 px-2 py-0.5 rounded text-xs border border-gray-700">{item.year}</span>
                                                        <span className="bg-gray-900/50 px-2 py-0.5 rounded text-xs border border-gray-700">{item.type}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </section>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
