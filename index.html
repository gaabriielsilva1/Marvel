        /* ============================================================
           MODAL DE AUTENTICAÇÃO
        ============================================================ */
        function AuthModal({ isOpen, onClose }) {
            const [isLogin, setIsLogin] = React.useState(true);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            if (!isOpen) return null;

            const handleAuthError = (err) => {
                switch (err.code) {
                    case 'auth/email-already-in-use': return 'Este e-mail já está cadastrado.';
                    case 'auth/invalid-credential': return 'E-mail ou senha incorretos.';
                    case 'auth/weak-password': return 'A senha deve ter pelo menos 6 caracteres.';
                    default: return 'Ocorreu um erro ao autenticar. Tente novamente.';
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(''); setLoading(true);
                try {
                    if (isLogin) {
                        await window.firebaseAPI.signInWithEmailAndPassword(window.firebaseAuth, email, password);
                    } else {
                        await window.firebaseAPI.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
                    }
                    onClose();
                } catch (err) { setError(handleAuthError(err)); }
                setLoading(false);
            };

            const handleGoogle = async () => {
                setError(''); setLoading(true);
                try {
                    await window.firebaseAPI.signInWithPopup(window.firebaseAuth, window.googleProvider);
                    onClose();
                } catch (err) { setError(handleAuthError(err)); }
                setLoading(false);
            };

            return (
                <div className="fixed inset-0 bg-black/75 z-[100] flex items-center justify-center p-4 animate-fade-in">
                    <div className="w-full max-w-sm bg-[#1a1a1a] border border-neutral-700 rounded-lg p-6 relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-neutral-500 hover:text-white transition-colors">
                            <Icons.Close />
                        </button>
                        <h2 className="text-lg font-semibold text-white mb-1">
                            {isLogin ? 'Entrar na conta' : 'Criar conta'}
                        </h2>
                        <p className="text-xs text-neutral-500 mb-5">
                            {isLogin ? 'Sincronize seu progresso em qualquer dispositivo.' : 'Crie sua conta para salvar na nuvem.'}
                        </p>
                        {error && (
                            <div className="mb-4 p-3 bg-red-950/60 border border-red-800 text-red-300 text-xs rounded-md">{error}</div>
                        )}
                        <form onSubmit={handleSubmit} className="flex flex-col gap-3">
                            <div>
                                <label className="block text-xs text-neutral-400 mb-1.5">E-mail</label>
                                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
                                    className="w-full bg-[#111] border border-neutral-700 rounded-md px-3 py-2.5 text-sm text-white focus:border-neutral-500 focus:outline-none transition-colors box-border"
                                    placeholder="seu@email.com" required />
                            </div>
                            <div>
                                <label className="block text-xs text-neutral-400 mb-1.5">Senha</label>
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
                                    className="w-full bg-[#111] border border-neutral-700 rounded-md px-3 py-2.5 text-sm text-white focus:border-neutral-500 focus:outline-none transition-colors box-border"
                                    placeholder="..." required />
                            </div>
                            <button type="submit" disabled={loading} style={{ minHeight: '48px' }}
                                className="w-full mt-1 bg-marvelRed hover:bg-red-700 text-white font-medium text-sm rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                {loading ? 'Aguarde...' : (isLogin ? 'Entrar' : 'Cadastrar')}
                            </button>
                        </form>
                        <div className="flex items-center gap-3 my-4">
                            <div className="h-px bg-neutral-800 flex-1"></div>
                            <span className="text-xs text-neutral-600">ou</span>
                            <div className="h-px bg-neutral-800 flex-1"></div>
                        </div>
                        <button onClick={handleGoogle} disabled={loading} style={{ minHeight: '48px' }}
                            className="w-full flex items-center justify-center gap-2.5 bg-white hover:bg-neutral-100 text-neutral-900 font-medium text-sm rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            <Icons.Google /> Continuar com Google
                        </button>
                        <p className="mt-5 text-center text-xs text-neutral-500">
                            {isLogin ? 'Não tem uma conta? ' : 'Já tem uma conta? '}
                            <button onClick={() => { setIsLogin(!isLogin); setError(''); }}
                                className="text-neutral-300 hover:text-white underline transition-colors">
                                {isLogin ? 'Criar conta' : 'Entrar'}
                            </button>
                        </p>
                    </div>
                </div>
            );
        }

        /* ============================================================
           APP PRINCIPAL
        ============================================================ */
        function App() {
            const [watched, setWatched] = React.useState(() => {
                try { const s = localStorage.getItem('mcuWatchedV2'); if (s) return JSON.parse(s); } catch (e) { }
                return {};
            });

            const [currentUser, setCurrentUser] = React.useState(null);
            const [isAuthModalOpen, setIsAuthModalOpen] = React.useState(false);
            const [isLoadingData, setIsLoadingData] = React.useState(false);

            const [expandedItems, setExpandedItems] = React.useState({});
            const [expandedPhases, setExpandedPhases] = React.useState({
                'Fase 1': true, 'Fase 2': true, 'Fase 3': true, 'Fase 4': true, 'Fase 5': true, 'Fase 6': true
            });

            const [filters, setFilters] = React.useState({ phase: 'Todas', type: 'Todos', status: 'Todos' });

            React.useEffect(() => {
                document.body.style.overflow = isAuthModalOpen ? 'hidden' : 'auto';
                return () => { document.body.style.overflow = 'auto'; };
            }, [isAuthModalOpen]);

            React.useEffect(() => {
                if (!window.firebaseAuth) return;
                const unsubAuth = window.firebaseAPI.onAuthStateChanged(window.firebaseAuth, (user) => {
                    setCurrentUser(user);
                    if (user) {
                        setIsLoadingData(true);
                        const ref = window.firebaseAPI.doc(window.firebaseDb, 'users', user.uid);
                        const unsubDb = window.firebaseAPI.onSnapshot(ref, (snap) => {
                            if (snap.exists()) { setWatched(snap.data().watched || {}); }
                            else { window.firebaseAPI.setDoc(ref, { watched }); }
                            setIsLoadingData(false);
                        });
                        return () => unsubDb();
                    } else {
                        setIsLoadingData(false);
                        try { const s = localStorage.getItem('mcuWatchedV2'); if (s) setWatched(JSON.parse(s)); } catch (e) { }
                    }
                });
                return () => unsubAuth();
            }, []);

            const updateWatchedState = (nw) => {
                setWatched(nw);
                if (currentUser && window.firebaseDb) {
                    window.firebaseAPI.setDoc(
                        window.firebaseAPI.doc(window.firebaseDb, 'users', currentUser.uid),
                        { watched: nw }, { merge: true }
                    );
                } else {
                    localStorage.setItem('mcuWatchedV2', JSON.stringify(nw));
                }
            };

            const toggleWatch = (id) => {
                const cur = watched[id];
                let nw;
                if (cur && cur.watched) { nw = { ...watched }; delete nw[id]; }
                else {
                    const today = new Date().toISOString().split('T')[0];
                    nw = { ...watched, [id]: { watched: true, rating: 0, date: today, notes: '', favorite: false } };
                }
                updateWatchedState(nw);
            };

            const toggleExpand = (id) => setExpandedItems(p => ({ ...p, [id]: !p[id] }));
            const updateDetails = (id, field, value) => updateWatchedState({ ...watched, [id]: { ...watched[id], [field]: value } });

            const selectAllPhase = (items) => {
                const today = new Date().toISOString().split('T')[0];
                const nw = { ...watched };
                items.forEach(i => {
                    if (!nw[i.id] || !nw[i.id].watched)
                        nw[i.id] = { ...nw[i.id], watched: true, rating: 0, date: today, notes: '', favorite: false };
                });
                updateWatchedState(nw);
            };

            const deselectAllPhase = (items) => {
                const nw = { ...watched };
                items.forEach(i => { if (nw[i.id]) delete nw[i.id]; });
                updateWatchedState(nw);
            };

            const phaseOptions = ['Todas', 'Fase 1', 'Fase 2', 'Fase 3', 'Fase 4', 'Fase 5', 'Fase 6'];
            const typeOptions = ['Todos', 'Filme', 'Serie', 'Animacao', 'Especial', 'Curtas'];
            const statusOptions = ['Todos', 'Assistidos', 'Nao assistidos'];

            const filteredList = mcuList.filter(item => {
                const iw = !!(watched[item.id] && watched[item.id].watched);
                if (filters.phase !== 'Todas' && item.phase !== filters.phase) return false;
                if (filters.type !== 'Todos' && item.type !== filters.type) return false;
                if (filters.status === 'Assistidos' && !iw) return false;
                if (filters.status === 'Nao assistidos' && iw) return false;
                return true;
            });

            const phases = filteredList.reduce((acc, item) => {
                if (!acc[item.phase]) acc[item.phase] = [];
                acc[item.phase].push(item);
                return acc;
            }, {});

            const total = mcuList.length;
            const watchedCount = mcuList.filter(i => watched[i.id] && watched[i.id].watched).length;
            const progress = total === 0 ? 0 : Math.round((watchedCount / total) * 100);

            // Sub-componente de filtros reajustado para alinhamento centralizado
            const FilterGroup = ({ label, options, filterKey }) => (
                <div className="flex flex-col items-center sm:flex-row sm:items-center gap-2 sm:gap-3">
                    <span className="text-[10px] text-neutral-600 uppercase tracking-widest whitespace-nowrap">{label}</span>
                    <div className="flex flex-wrap justify-center gap-1.5">
                        {options.map(opt => (
                            <button key={opt}
                                onClick={() => setFilters(p => ({ ...p, [filterKey]: opt }))}
                                className={`px-3 py-1 text-xs rounded-full border transition-colors ${filters[filterKey] === opt
                                    ? 'bg-neutral-100 text-neutral-900 border-neutral-100 font-medium'
                                    : 'bg-pill border-neutral-800 text-neutral-400 hover:text-white hover:border-neutral-600'
                                    }`}>
                                {opt}
                            </button>
                        ))}
                    </div>
                </div>
            );

            return (
                <>
                    <AuthModal isOpen={isAuthModalOpen} onClose={() => setIsAuthModalOpen(false)} />

                    {isLoadingData && currentUser && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-[#1a1a1a] border border-neutral-700 text-neutral-300 text-xs px-4 py-2 rounded-full shadow-lg">
                            Sincronizando...
                        </div>
                    )}

                    <div className="w-full flex flex-col min-h-screen">

                        {/* HEADER HORIZONTAL: CENTRALIZADO, FULL-WIDTH */}
                        <header className="relative flex items-center justify-between px-4 md:px-12 py-4 border-b border-neutral-800 bg-background sticky top-0 z-40 min-h-[72px]">

                            {/* Esquerda: Barra de Progresso (Desktop) - Usa flex-1 para manter espaçamento lateral */}
                            <div className="flex-1 hidden md:flex items-center justify-start gap-3">
                                <div className="w-full max-w-[200px] h-1.5 bg-neutral-800 rounded-full overflow-hidden">
                                    <div className="h-full bg-marvelRed rounded-full transition-all duration-700" style={{ width: `${progress}%` }}></div>
                                </div>
                                <span className="text-xs text-neutral-500 whitespace-nowrap font-medium">{watchedCount} / {total}</span>
                            </div>

                            {/* Esquerda: Spacer invisível para Mobile (para manter flex space-between seguro se necessário) */}
                            <div className="flex-1 flex md:hidden justify-start"></div>

                            {/* Centro: Título do App centralizado de forma absoluta */}
                            <div className="absolute left-1/2 -translate-x-1/2 flex items-center gap-3 pointer-events-none">
                                <span className="text-xl md:text-2xl font-bold tracking-widest text-white pointer-events-auto">MCU</span>
                                <span className="text-xs font-medium text-neutral-600 hidden sm:block uppercase tracking-widest mt-1 pointer-events-auto">Checklist</span>
                            </div>

                            {/* Direita: Autenticação - Usa flex-1 para manter equivalência com a esquerda */}
                            <div className="flex-1 flex items-center justify-end gap-3">
                                {currentUser ? (
                                    <div className="flex items-center gap-3">
                                        {currentUser.photoURL
                                            ? <img src={currentUser.photoURL} alt="User" className="w-7 h-7 md:w-8 md:h-8 rounded-full" />
                                            : <div className="w-7 h-7 md:w-8 md:h-8 rounded-full bg-neutral-700 flex items-center justify-center text-neutral-300"><Icons.User /></div>
                                        }
                                        <span className="text-xs text-neutral-400 hidden lg:block">
                                            {currentUser.displayName || currentUser.email.split('@')[0]}
                                        </span>
                                        <button onClick={() => window.firebaseAPI.signOut(window.firebaseAuth)}
                                            className="flex items-center gap-1.5 text-xs text-neutral-500 hover:text-white transition-colors">
                                            <Icons.LogOut /> <span className="hidden sm:inline">Sair</span>
                                        </button>
                                    </div>
                                ) : (
                                    <button onClick={() => setIsAuthModalOpen(true)} style={{ minHeight: '36px' }}
                                        className="flex items-center gap-2 px-4 text-xs font-medium bg-neutral-800 hover:bg-neutral-700 text-white rounded-md border border-neutral-700 transition-colors">
                                        <Icons.User /> Entrar
                                    </button>
                                )}
                            </div>
                        </header>

                        {/* BARRA DE FILTROS HORIZONTAL E CENTRALIZADA */}
                        <div className="px-4 md:px-12 py-5 border-b border-neutral-800 bg-background w-full">
                            <div className="flex justify-center items-center flex-wrap gap-x-8 gap-y-4 w-full">
                                <FilterGroup label="Fase" options={phaseOptions} filterKey="phase" />
                                <FilterGroup label="Tipo" options={typeOptions} filterKey="type" />
                                <FilterGroup label="Status" options={statusOptions} filterKey="status" />
                            </div>

                            {/* Progresso Mobile: Embaixo dos filtros e centralizado */}
                            <div className="flex md:hidden justify-center items-center gap-3 mt-5 w-full">
                                <div className="w-48 h-1.5 bg-neutral-800 rounded-full overflow-hidden">
                                    <div className="h-full bg-marvelRed rounded-full transition-all duration-700" style={{ width: `${progress}%` }}></div>
                                </div>
                                <span className="text-[10px] text-neutral-500 font-medium">{progress}%</span>
                            </div>
                        </div>

                        {/* GRID E CARDS: FULL-WIDTH COM 5 COLUNAS NO LARGEST SCREEN */}
                        <main className="flex-1 px-4 md:px-12 py-8 w-full">
                            {Object.keys(phases).length === 0 ? (
                                <div className="text-center text-neutral-600 text-sm py-16">
                                    Nenhum titulo encontrado com os filtros selecionados.
                                </div>
                            ) : (
                                Object.entries(phases).map(([phase, items]) => {
                                    const isPhaseComplete = items.every(i => watched[i.id] && watched[i.id].watched) && items.length > 0;
                                    const allWatched = items.every(i => watched[i.id] && watched[i.id].watched);
                                    const isExpPhase = !!expandedPhases[phase];

                                    return (
                                        <section key={phase} className="mb-10 w-full">
                                            <div className={`flex items-center justify-between mb-4 pb-3 border-b ${isPhaseComplete ? 'border-yellow-800/50' : 'border-neutral-800'}`}>
                                                <button
                                                    onClick={() => setExpandedPhases(p => ({ ...p, [phase]: !p[phase] }))}
                                                    className="flex items-center gap-3 group text-left outline-none">
                                                    <span className={`w-0.5 h-5 rounded-full ${isPhaseComplete ? 'bg-yellow-500' : 'bg-marvelRed'}`}></span>
                                                    <span className={`font-semibold text-sm tracking-wide ${isPhaseComplete ? 'text-yellow-500' : 'text-white'}`}>
                                                        {phase}
                                                    </span>
                                                    {isPhaseComplete && (
                                                        <span className="text-[10px] bg-yellow-900/30 border border-yellow-700/40 text-yellow-600 px-2 py-0.5 rounded-full hidden sm:inline-block">
                                                            Completa
                                                        </span>
                                                    )}
                                                    <span className="text-xs text-neutral-600">
                                                        {items.filter(i => watched[i.id] && watched[i.id].watched).length}/{items.length}
                                                    </span>
                                                    <span className={`text-neutral-600 transition-transform duration-300 ${isExpPhase ? 'rotate-180' : ''}`}>
                                                        <Icons.ChevronDown />
                                                    </span>
                                                </button>

                                                <button
                                                    onClick={() => allWatched ? deselectAllPhase(items) : selectAllPhase(items)}
                                                    className="text-[10px] text-neutral-500 hover:text-white border border-neutral-800 hover:border-neutral-600 px-3 py-1 rounded-full transition-colors outline-none">
                                                    {allWatched ? 'Desmarcar tudo' : 'Marcar tudo'}
                                                </button>
                                            </div>

                                            {/* Expansão da Grid baseada na largura Full-Width da página */}
                                            <div className={`grid transition-[grid-template-rows,opacity] duration-300 ease-in-out ${isExpPhase ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'}`}>
                                                <div className="overflow-hidden">
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
                                                        {items.map(item => {
                                                            const itemData = watched[item.id] || {};
                                                            const isWatched = !!itemData.watched;
                                                            const isExpItem = !!expandedItems[item.id];

                                                            return (
                                                                <div key={item.id}
                                                                    className={`bg-card border rounded-lg overflow-hidden transition-colors ${isWatched ? 'border-neutral-700' : 'border-neutral-800 hover:border-neutral-700'}`}>

                                                                    <div onClick={() => toggleWatch(item.id)}
                                                                        className="flex items-center gap-3 p-4 cursor-pointer select-none">

                                                                        <div className={`w-5 h-5 rounded-sm flex-shrink-0 flex items-center justify-center border transition-colors ${isWatched ? 'bg-marvelRed border-marvelRed' : 'border-neutral-600 bg-transparent hover:border-neutral-400'}`}>
                                                                            {isWatched && <Icons.Check />}
                                                                        </div>

                                                                        <div className="flex-1 min-w-0">
                                                                            <p className={`text-sm font-medium leading-snug truncate transition-colors ${isWatched ? 'text-marvelRed line-through opacity-80' : 'text-neutral-100'}`}>
                                                                                {item.title}
                                                                            </p>
                                                                            <p className={`text-xs mt-0.5 transition-colors ${isWatched ? 'text-neutral-600' : 'text-neutral-500'}`}>
                                                                                {item.year} · {item.type}
                                                                            </p>
                                                                        </div>

                                                                        <button
                                                                            onClick={(e) => { e.stopPropagation(); toggleExpand(item.id); }}
                                                                            className={`flex-shrink-0 p-1 text-neutral-600 hover:text-neutral-300 transition-all duration-200 outline-none ${isExpItem ? 'rotate-180 text-neutral-300' : ''}`}>
                                                                            <Icons.ChevronDown />
                                                                        </button>
                                                                    </div>

                                                                    <div className={`grid transition-[grid-template-rows,opacity] duration-300 ease-in-out ${isExpItem ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'}`}>
                                                                        <div className="overflow-hidden">
                                                                            <div className="px-4 pb-4 pt-2 border-t border-neutral-800 flex flex-col gap-3 bg-[#161616]">

                                                                                <div className="flex items-center justify-between">
                                                                                    <div className="flex gap-0.5">
                                                                                        {[1, 2, 3, 4, 5].map(star => (
                                                                                            <button key={star}
                                                                                                onClick={() => updateDetails(item.id, 'rating', itemData.rating === star ? 0 : star)}
                                                                                                className={`text-lg leading-none transition-colors outline-none ${(itemData.rating || 0) >= star ? 'text-yellow-500' : 'text-neutral-700 hover:text-yellow-700'}`}>
                                                                                                ★
                                                                                            </button>
                                                                                        ))}
                                                                                    </div>
                                                                                    <button
                                                                                        onClick={() => updateDetails(item.id, 'favorite', !itemData.favorite)}
                                                                                        className={`p-1 transition-colors outline-none ${itemData.favorite ? 'text-marvelRed' : 'text-neutral-700 hover:text-neutral-400'}`}>
                                                                                        <Icons.Heart filled={itemData.favorite} />
                                                                                    </button>
                                                                                </div>

                                                                                <input
                                                                                    type="date"
                                                                                    value={itemData.date || ''}
                                                                                    onChange={(e) => updateDetails(item.id, 'date', e.target.value)}
                                                                                    className="w-full bg-[#111] border border-neutral-800 rounded px-3 py-1.5 text-xs text-neutral-400 focus:outline-none focus:border-neutral-600 transition-colors" />

                                                                                <textarea
                                                                                    value={itemData.notes || ''}
                                                                                    onChange={(e) => updateDetails(item.id, 'notes', e.target.value)}
                                                                                    placeholder="Adicionar anotações..."
                                                                                    rows={2}
                                                                                    className="w-full bg-[#111] border border-neutral-800 rounded px-3 py-1.5 text-xs text-neutral-400 placeholder-neutral-700 focus:outline-none focus:border-neutral-600 resize-none transition-colors" />
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            </div>
                                        </section>
                                    );
                                })
                            )}
                        </main>

                        <footer className="py-6 text-center text-xs text-neutral-600 border-t border-neutral-800 w-full">
                            {watchedCount} assistidos de {total} titulos · {progress}% completo
                        </footer>
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
