    <!-- Tailwind CSS -->

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    screens: {
                        '3xl': '1920px',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        scifi: ['Rajdhani', 'sans-serif'],
                    },
                    colors: {
                        space: '#03050a',
                        glass: 'rgba(20, 20, 30, 0.7)',
                        mcuRed: '#e23636',
                        arcBlue: '#00d2ff',
                        infinityGold: '#ffd700',
                        infinityPurple: '#8a2be2'
                    },
                    backgroundImage: {
                        'cosmos': 'radial-gradient(circle at 50% 0%, #1a0b1c 0%, #03050a 60%, #03050a 100%)',
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: 0.5, filter: 'blur(8px)' },
                            '50%': { opacity: 1, filter: 'blur(12px)' },
                        },
                        fadeIn: {
                            'from': { opacity: 0, transform: 'translateY(-10px)' },
                            'to': { opacity: 1, transform: 'translateY(0)' },
                        },
                        slideUp: {
                            'from': { opacity: 0, transform: 'translateY(20px)' },
                            'to': { opacity: 1, transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #03050a;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 15, 23, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .glass-card {
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease-in-out;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        .neon-active {
            border-color: rgba(0, 210, 255, 0.4);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.15);
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.08) 0%, rgba(15, 15, 20, 0.9) 100%);
        }

        .phase-complete {
            position: relative;
        }

        .phase-complete::before {
            content: '';
            position: absolute;
            inset: -1px;
            padding: 1px;
            background: linear-gradient(90deg, #ffd700, #8a2be2, #ffd700);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #03050a;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(226, 54, 54, 0.5);
        }

        ::-webkit-calendar-picker-indicator {
            filter: invert(0.8) sepia(1) hue-rotate(180deg) saturate(200%);
            cursor: pointer;
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .text-glow-blue {
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.8);
        }

        .text-glow-red {
            text-shadow: 0 0 12px rgba(226, 54, 54, 0.8);
        }
    </style>
</head>

        const Icons = {
            Check: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>,

        };

        function App() {
            const [watched, setWatched] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('mcuWatchedV2');
                    if (saved) return JSON.parse(saved);
                } catch (e) {
                    console.error("Falha ao carregar save", e);
                }
                return {};
            });

            const [expandedItems, setExpandedItems] = React.useState({});
            const [expandedPhases, setExpandedPhases] = React.useState(() => {
                const initialState = {};
                const todasAsFases = ['Fase 1', 'Fase 2', 'Fase 3', 'Fase 4', 'Fase 5', 'Fase 6'];
                todasAsFases.forEach(p => {
                    initialState[p] = true;
                });
                return initialState;
            });

            const [typeFilter, setTypeFilter] = React.useState('Todos');
            const [selectedPhase, setSelectedPhase] = React.useState('Todas');

            React.useEffect(() => {
                localStorage.setItem('mcuWatchedV2', JSON.stringify(watched));
            }, [watched]);

            const toggleWatch = (id) => {
                setWatched(prev => {
                    const current = prev[id];
                    if (current && current.watched) {
                        const newState = { ...prev };
                        delete newState[id];
                        return newState;
                    } else {
                        const today = new Date().toISOString().split('T')[0];
                        return { ...prev, [id]: { watched: true, rating: 0, date: today, notes: '', favorite: false } };
                    }
                });
            };

            const toggleExpand = (id) => {
                setExpandedItems(prev => ({
                    ...prev,
                    [id]: !prev[id]
                }));
            };

            const togglePhaseExpand = (phaseName) => {
                setExpandedPhases(prev => ({
                    ...prev,
                    [phaseName]: !prev[phaseName]
                }));
            };

            const updateDetails = (id, field, value) => {
                setWatched(prev => ({
                    ...prev,
                    [id]: { ...prev[id], [field]: value }
                }));
            };

            const selectAllPhase = (items) => {
                const today = new Date().toISOString().split('T')[0];
                setWatched(prev => {
                    const newState = { ...prev };
                    items.forEach(item => {
                        if (!newState[item.id] || !newState[item.id].watched) {
                            newState[item.id] = { ...newState[item.id], watched: true, rating: 0, date: today, notes: '', favorite: false };
                        }
                    });
                    return newState;
                });
            };

            const deselectAllPhase = (items) => {
                setWatched(prev => {
                    const newState = { ...prev };
                    items.forEach(item => {
                        if (newState[item.id]) {
                            delete newState[item.id];
                        }
                    });
                    return newState;
                });
            };

            const handlePhaseClick = (phaseName) => {
                setSelectedPhase(phaseName);
                if (phaseName !== 'Todas') {
                    const el = document.getElementById(`section-${phaseName.replace(/\s+/g, '-').toLowerCase()}`);
                    // Margem extra no scroll para compensar eventuais menus sticky em celulares
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            };

            const filteredList = mcuList.filter(item => {
                if (typeFilter === 'Filmes' && item.type !== 'Filme') return false;
                if (typeFilter === 'Séries' && item.type === 'Filme') return false;
                if (selectedPhase !== 'Todas' && item.phase !== selectedPhase) return false;
                return true;
            });

            const phases = filteredList.reduce((acc, item) => {
                if (!acc[item.phase]) acc[item.phase] = [];
                acc[item.phase].push(item);
                return acc;
            }, {});

            const total = mcuList.length;
            const watchedCount = mcuList.filter(item => watched[item.id]?.watched).length;
            const progress = total === 0 ? 0 : Math.round((watchedCount / total) * 100);

            const allPhasesList = ['Fase 1', 'Fase 2', 'Fase 3', 'Fase 4', 'Fase 5', 'Fase 6'];

            return (
                <div className="w-full px-3 sm:px-4 md:px-8 py-6 animate-fade-in relative z-10">

                    {/* Cabeçalho Otimizado */}
                    <header className="mb-6 md:mb-8 text-center glass-panel pt-6 pb-8 md:pt-8 md:pb-10 px-4 rounded-none relative overflow-hidden w-full border-b border-white/10">
                        <div className="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-mcuRed to-transparent"></div>
                        <h1 className="text-3xl md:text-5xl lg:text-6xl font-black uppercase tracking-widest bg-clip-text text-transparent bg-gradient-to-br from-white via-gray-200 to-gray-500 drop-shadow-lg">
                            MCU <span className="text-transparent bg-clip-text bg-gradient-to-r from-mcuRed to-red-800 text-glow-red">Checklist</span>
                        </h1>

                        {/* Progress Bar com Safe Margin no Mobile */}
                        <div className="w-full max-w-4xl mx-auto mt-6 md:mt-8 px-4">
                            <div className="flex justify-between items-end mb-2 px-1">
                                <span className="text-xs font-bold tracking-widest text-arcBlue uppercase">{progress}% Sincronizado</span>
                                <span className="text-xs text-gray-400 font-scifi tracking-widest uppercase">{watchedCount} / {total} Registros</span>
                            </div>
                            <div className="h-[2px] w-full bg-white/5 rounded-none overflow-hidden relative">
                                <div className="absolute inset-0 bg-arcBlue blur-md opacity-30 animate-pulse-glow" style={{ width: `${progress}%` }}></div>
                                <div
                                    className="h-full rounded-none bg-gradient-to-r from-mcuRed via-purple-500 to-arcBlue relative z-10 transition-all duration-1000 ease-out shadow-[0_0_10px_rgba(0,210,255,0.8)]"
                                    style={{ width: `${progress}%` }}
                                >
                                    <div className="absolute top-0 right-0 bottom-0 w-4 bg-white/40 blur-[2px]"></div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="flex flex-col lg:flex-row gap-6 md:gap-8 items-start w-full">

                        {/* Sidebar Reformulada para Mobile (Horizontal) e Desktop (Vertical) */}
                        <aside className="w-full lg:w-80 flex-shrink-0 lg:sticky lg:top-8 z-20 space-y-4 lg:space-y-6">
                            <div className="glass-panel p-4 lg:p-6 rounded-none border border-white/5 flex flex-col gap-4 lg:gap-6">

                                {/* Filtro por Mídia - Horizontal Scroll no Mobile */}
                                <div className="w-full overflow-hidden">
                                    <h3 className="text-xs font-bold tracking-widest text-gray-400 uppercase mb-3">FILTRAR POR MÍDIA</h3>
                                    <div className="flex flex-row lg:flex-wrap items-center gap-2.5 overflow-x-auto whitespace-nowrap pb-2 lg:pb-0 [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]">
                                        {['Todos', 'Filmes', 'Séries'].map(f => (
                                            <button
                                                key={f}
                                                onClick={() => setTypeFilter(f)}
                                                className={`flex-shrink-0 px-5 py-2 text-sm font-semibold tracking-wide transition-all duration-200 rounded-2xl border ${typeFilter === f
                                                    ? 'bg-arcBlue/10 border-arcBlue text-arcBlue shadow-[0_0_12px_rgba(0,210,255,0.3)]'
                                                    : 'bg-[#0c0f17] border-transparent text-gray-300 hover:text-white hover:bg-white/10'
                                                    }`}
                                            >
                                                {f}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="w-full h-px bg-white/5 hidden lg:block"></div>

                                {/* Linha do Tempo - Horizontal Scroll no Mobile */}
                                <div className="w-full overflow-hidden">
                                    <h3 className="text-xs font-bold tracking-widest text-gray-400 uppercase mb-3">Linha do Tempo</h3>
                                    <div className="flex flex-row lg:flex-col gap-2 overflow-x-auto whitespace-nowrap pb-2 lg:pb-0 [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]">
                                        <button
                                            onClick={() => handlePhaseClick('Todas')}
                                            className={`flex-shrink-0 lg:w-full py-2.5 px-4 rounded-none text-xs font-bold uppercase tracking-wider transition-all duration-300 border text-left
                                        ${selectedPhase === 'Todas'
                                                    ? 'bg-mcuRed/20 border-mcuRed text-white shadow-[0_0_12px_rgba(226,54,54,0.4)]'
                                                    : 'bg-black/30 border-white/5 text-gray-400 hover:text-white hover:border-white/20'
                                                }`}
                                        >
                                            Todas as Fases
                                        </button>
                                        {allPhasesList.map((p) => {
                                            const phaseItems = mcuList.filter(i => i.phase === p);
                                            const phaseWatched = phaseItems.filter(i => watched[i.id]?.watched).length;
                                            const isComplete = phaseWatched === phaseItems.length && phaseItems.length > 0;

                                            return (
                                                <button
                                                    key={p}
                                                    onClick={() => handlePhaseClick(p)}
                                                    className={`flex-shrink-0 lg:w-full py-2.5 px-4 rounded-none text-xs font-bold uppercase tracking-wider transition-all duration-300 border flex gap-3 lg:justify-between items-center
                                                ${selectedPhase === p
                                                            ? 'bg-arcBlue/20 border-arcBlue text-arcBlue shadow-[0_0_12px_rgba(0,210,255,0.4)]'
                                                            : isComplete
                                                                ? 'bg-infinityGold/10 border-infinityGold/40 text-infinityGold hover:border-infinityGold'
                                                                : 'bg-black/30 border-white/5 text-gray-400 hover:text-white hover:border-white/20'
                                                        }`}
                                                >
                                                    <span>{p}</span>
                                                    <span className="text-[11px] opacity-70 font-scifi">({phaseWatched}/{phaseItems.length})</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </aside>

                        {/* Main Content com Padding Extra Inferior no Mobile */}
                        <main className="flex-1 w-full space-y-8 lg:space-y-10 pb-24 lg:pb-0">
                            {Object.keys(phases).length === 0 ? (
                                <div className="text-center py-12 glass-panel rounded-none border border-white/5 w-full">
                                    <p className="text-gray-400 font-scifi tracking-wider text-lg">Nenhum título encontrado com os filtros aplicados.</p>
                                </div>
                            ) : (
                                Object.entries(phases).map(([phase, items], phaseIndex) => {
                                    const isPhaseComplete = items.every(item => watched[item.id]?.watched) && items.length > 0;
                                    const sectionId = `section-${phase.replace(/\s+/g, '-').toLowerCase()}`;

                                    return (
                                        <section
                                            key={phase}
                                            id={sectionId}
                                            className={`w-full p-4 sm:p-6 md:p-8 rounded-none border border-white/5 transition-all duration-500 slide-up scroll-mt-24 lg:scroll-mt-6
                                        ${isPhaseComplete ? 'phase-complete bg-gray-900/40 glass-panel' : 'glass-panel'}
                                    `}
                                            style={{ animationDelay: `${phaseIndex * 0.05}s` }}
                                        >
                                            {/* Cabeçalho da Fase ajustado para não encavalar no mobile */}
                                            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-2 border-b border-white/5 pb-4 gap-4">

                                                <div
                                                    onClick={() => togglePhaseExpand(phase)}
                                                    className="flex items-center gap-3 sm:gap-4 cursor-pointer group w-full sm:w-auto select-none"
                                                >
                                                    <h2 className={`text-xl sm:text-2xl md:text-3xl font-black uppercase tracking-wider flex items-center gap-3 sm:gap-4 transition-colors duration-300
                                                ${isPhaseComplete ? 'text-transparent bg-clip-text bg-gradient-to-r from-infinityGold to-infinityPurple text-glow' : 'text-white group-hover:text-mcuRed'}
                                            `}>
                                                        <span className={`w-1.5 sm:w-2 h-6 sm:h-8 rounded-none inline-block ${isPhaseComplete ? 'bg-gradient-to-b from-infinityGold to-infinityPurple shadow-[0_0_10px_#ffd700]' : 'bg-mcuRed'}`}></span>
                                                        {phase}

                                                        {isPhaseComplete && (
                                                            <span className="px-2 py-1 bg-infinityGold/20 border border-infinityGold/50 text-infinityGold text-[10px] sm:text-xs font-bold rounded-none uppercase tracking-widest animate-pulse ml-1 sm:ml-2">
                                                                Concluída
                                                            </span>
                                                        )}
                                                    </h2>

                                                    <button
                                                        className={`flex-shrink-0 p-2 text-gray-400 group-hover:text-white transition-all duration-300 transform
                                                    ${expandedPhases[phase] ? 'rotate-180 text-arcBlue drop-shadow-[0_0_8px_rgba(0,210,255,0.6)]' : ''}
                                                `}
                                                    >
                                                        <Icons.ChevronDown />
                                                    </button>
                                                </div>

                                                {/* Botões ocupando largura total (flex-1) em celular */}
                                                <div className="flex w-full sm:w-auto items-center gap-2 relative z-10">
                                                    <button
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            selectAllPhase(items);
                                                        }}
                                                        className="flex-1 sm:flex-none px-3 py-2.5 sm:py-2 bg-black/40 border border-white/10 hover:border-arcBlue text-gray-300 hover:text-arcBlue text-[11px] sm:text-xs font-bold uppercase tracking-wider rounded-none transition-all duration-300"
                                                    >
                                                        Marcar Tudo
                                                    </button>
                                                    <button
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            deselectAllPhase(items);
                                                        }}
                                                        className="flex-1 sm:flex-none px-3 py-2.5 sm:py-2 bg-black/40 border border-white/10 hover:border-mcuRed text-gray-300 hover:text-mcuRed text-[11px] sm:text-xs font-bold uppercase tracking-wider rounded-none transition-all duration-300"
                                                    >
                                                        Desmarcar
                                                    </button>
                                                </div>
                                            </div>

                                            {/* Itens do Grid */}
                                            <div className={`grid transition-[grid-template-rows,opacity,margin] duration-500 ease-in-out w-full
                                        ${expandedPhases[phase] ? 'grid-rows-[1fr] opacity-100 mt-6' : 'grid-rows-[0fr] opacity-0 mt-0'}
                                    `}>
                                                <div className="overflow-hidden min-h-0">
                                                    <div className="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 3xl:grid-cols-4 gap-4 items-start pt-1">
                                                        {items.map(item => {
                                                            const itemData = watched[item.id] || {};
                                                            const isWatched = !!itemData.watched;
                                                            const isExpanded = !!expandedItems[item.id];
                                                            const isFilme = item.type === 'Filme';

                                                            return (
                                                                <div
                                                                    key={item.id}
                                                                    className={`glass-card flex flex-col p-4 sm:p-5 rounded-none relative overflow-hidden group border border-white/5 h-fit
                                                                ${isWatched ? 'neon-active' : ''}
                                                            `}
                                                                >
                                                                    <div className={`absolute -right-10 -top-10 w-32 h-32 bg-arcBlue/10 blur-3xl rounded-none transition-opacity duration-500 ${isWatched ? 'opacity-100' : 'opacity-0'}`}></div>

                                                                    <div
                                                                        onClick={() => toggleWatch(item.id)}
                                                                        className="cursor-pointer flex items-start gap-3 sm:gap-4 relative z-10 w-full"
                                                                    >
                                                                        <div
                                                                            className={`mt-1 flex-shrink-0 w-6 h-6 rounded-none flex items-center justify-center border transition-all duration-300 group-hover:scale-110
                                                                    ${isWatched
                                                                                    ? 'bg-arcBlue border-arcBlue text-space shadow-[0_0_10px_rgba(0,210,255,0.8)]'
                                                                                    : 'border-gray-600 group-hover:border-mcuRed text-transparent'
                                                                                }`}
                                                                        >
                                                                            <Icons.Check />
                                                                        </div>

                                                                        <div className="flex-1 pr-1">
                                                                            <h3 className={`font-bold text-sm sm:text-base leading-snug mb-2 transition-colors duration-300
                                                                        ${isWatched ? 'text-white text-glow-blue' : 'text-gray-200 group-hover:text-mcuRed'}
                                                                    `}>
                                                                                {item.title}
                                                                            </h3>
                                                                            <div className="flex flex-wrap gap-2 text-xs font-medium">
                                                                                <span className="bg-black/50 text-gray-300 px-2 py-0.5 rounded-none border border-white/5 font-scifi text-xs">
                                                                                    {item.year}
                                                                                </span>
                                                                                <span className={`flex items-center px-2 py-0.5 rounded-none border border-white/5 text-xs
                                                                            ${isFilme ? 'bg-mcuRed/10 text-red-300' : 'bg-blue-900/30 text-blue-300'}
                                                                        `}>
                                                                                    {isFilme ? <Icons.Film /> : <Icons.TV />}
                                                                                    {item.type}
                                                                                </span>
                                                                            </div>
                                                                        </div>

                                                                        {/* Área de Toque ampliada para o botão de Chevron no Celular */}
                                                                        <button
                                                                            onClick={(e) => {
                                                                                e.stopPropagation();
                                                                                toggleExpand(item.id);
                                                                            }}
                                                                            className={`flex-shrink-0 p-3 -mr-2 -mt-2 text-gray-400 hover:text-white transition-all duration-300 transform self-start
                                                                        ${isExpanded ? 'rotate-180 text-arcBlue drop-shadow-[0_0_8px_rgba(0,210,255,0.6)]' : ''}
                                                                    `}
                                                                        >
                                                                            <Icons.ChevronDown />
                                                                        </button>
                                                                    </div>

                                                                    <div className={`grid transition-[grid-template-rows,opacity,margin] duration-300 ease-in-out w-full
                                                                ${isExpanded ? 'grid-rows-[1fr] opacity-100 mt-4' : 'grid-rows-[0fr] opacity-0 mt-0'}
                                                            `}>
                                                                        <div className="overflow-hidden min-h-0">
                                                                            <div className="pt-3 border-t border-white/5 flex flex-col gap-3 relative z-10">
                                                                                <div className="flex justify-between items-center bg-black/40 p-2 rounded-none border border-white/5">
                                                                                    <div className="flex gap-1 px-1">
                                                                                        {[1, 2, 3, 4, 5].map((star) => (
                                                                                            <button
                                                                                                key={star}
                                                                                                onClick={() => updateDetails(item.id, 'rating', itemData.rating === star ? 0 : star)}
                                                                                                className={`text-lg sm:text-xl p-1 sm:p-0 focus:outline-none transition-all duration-200 hover:scale-110
                                                                                            ${(itemData.rating || 0) >= star
                                                                                                        ? 'text-infinityGold drop-shadow-[0_0_8px_rgba(255,215,0,0.8)]'
                                                                                                        : 'text-gray-700 hover:text-infinityGold/50'
                                                                                                    }
                                                                                        `}
                                                                                            >
                                                                                                ★
                                                                                            </button>
                                                                                        ))}
                                                                                    </div>
                                                                                    <button
                                                                                        onClick={() => updateDetails(item.id, 'favorite', !itemData.favorite)}
                                                                                        className={`focus:outline-none p-2 rounded-none transition-all duration-300 hover:bg-white/5
                                                                                    ${itemData.favorite ? 'text-mcuRed drop-shadow-[0_0_8px_rgba(226,54,54,0.8)]' : 'text-gray-600 hover:text-mcuRed/70'}
                                                                                `}
                                                                                    >
                                                                                        <Icons.Heart filled={itemData.favorite} />
                                                                                    </button>
                                                                                </div>

                                                                                <div className="flex flex-col gap-2">
                                                                                    <div className="relative group">
                                                                                        <div className="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-500">
                                                                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                                                                        </div>
                                                                                        <input
                                                                                            type="date"
                                                                                            value={itemData.date || ''}
                                                                                            onChange={(e) => updateDetails(item.id, 'date', e.target.value)}
                                                                                            className="w-full bg-black/40 border border-white/5 rounded-none pl-9 pr-3 py-2 sm:py-1.5 text-xs text-gray-300 focus:outline-none focus:border-arcBlue font-scifi tracking-wider"
                                                                                        />
                                                                                    </div>
                                                                                    <textarea
                                                                                        value={itemData.notes || ''}
                                                                                        onChange={(e) => updateDetails(item.id, 'notes', e.target.value)}
                                                                                        placeholder="Adicionar anotações multiversais..."
                                                                                        className="w-full bg-black/40 border border-white/5 rounded-none px-3 py-2 sm:py-1.5 text-xs text-gray-300 focus:outline-none focus:border-arcBlue resize-none h-16 sm:h-14 placeholder-gray-600"
                                                                                    ></textarea>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            </div>
                                        </section>
                                    );
                                })
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
